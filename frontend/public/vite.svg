<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="fancyOrangeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" /> <stop offset="100%" style="stop-color:#FF4500;stop-opacity:1" /> </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" /> <feOffset dx="5" dy="8" result="offsetblur" /> <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/> </feComponentTransfer>
      <feMerge>
        <feMergeNode /> <feMergeNode in="SourceGraphic" /> </feMerge>
    </filter>
  </defs>

  <text
    x="50%"
    y="50%"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="400"
    font-weight="bold"
    fill="url(#fancyOrangeGradient)"
    stroke="#CC3700"
    stroke-width="4"
    filter="url(#softShadow)"
    text-anchor="middle"
    dominant-baseline="central"
  >
    S
  </text>
</svg>